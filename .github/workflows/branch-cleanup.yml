name: Branch Cleanup

on:
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 04:00 UTC
  workflow_dispatch:
    inputs:
      age_days:
        description: "Delete stale branches with no commits in N days"
        required: false
        type: number
        default: 14
      max_deletions:
        description: "Hard cap on branches deleted per run"
        required: false
        type: number
        default: 50

jobs:
  cleanup:
    uses: ./.github/workflows/branch-cleanup.yml
    with:
      age_days: ${{ inputs.age_days || 14 }}
      max_deletions: ${{ inputs.max_deletions || 50 }}
