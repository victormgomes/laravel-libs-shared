name: Sync Repository Settings

on:
  push:
    branches:
      - main
    paths:
      - "configs/repo-settings.yml"
      - "configs/rulesets/**"
  workflow_dispatch:

jobs:
  sync-settings:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Update Repository Settings
        uses: joshjohanning/bulk-github-repo-settings-sync-action@v2
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          repositories-file: "configs/repo-settings.yml"
          delete-branch-on-merge: true
          allow-squash-merge: true
          allow-merge-commit: false
          allow-rebase-merge: true
          rulesets-file: "configs/rulesets/main-protection.json"
          delete-unmanaged-rulesets: true

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          REPOS="victormgomes/laravel-query-engine victormgomes/async-api"
          for repo in $REPOS; do
            echo "Configuring GitHub Pages for $repo..."
            # Check if Pages is already enabled
            if gh api "repos/$repo/pages" --silent 2>/dev/null; then
              echo "  Pages already enabled on $repo, skipping."
            else
              # Enable Pages with workflow build type
              gh api -X POST "repos/$repo/pages" \
                -f build_type='workflow' \
                -F source='{"branch":"main","path":"/docs"}' 2>/dev/null && \
                echo "  Pages enabled on $repo." || \
                echo "  Warning: Could not enable Pages on $repo."
            fi
          done
